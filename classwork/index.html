<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id='app'>
        <h1>{{ message }}</h1>
    </div>

    <script src="https://unpkg.com/vue@next"></script>
    <!-- <script src="https://unpkg.com/vue@next"></script> -->
    <script>
        let app = Vue.createApp({
            data: function() {
                return {
                    message: 'hello vue'
                }
            }
        })
        app.mount('#app')
    </script>
</body>

</html>
